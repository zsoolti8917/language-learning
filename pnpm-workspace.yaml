packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e

# Every dependency of the stack is pinned here, exactly. Packages reference
# them with "catalog:". Adding or changing an entry is a shared surface change.
catalog:
  # Client
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.8
  "@vitejs/plugin-react": 6.3.0
  vite-plugin-pwa: 2.0.0
  workbox-window: 7.4.1
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.169.0
  "@tanstack/react-query": 5.108.0
  dexie: 4.4.7
  tailwindcss: 4.3.5
  "@tailwindcss/vite": 4.3.5
  radix-ui: 1.8.1
  vaul: 1.1.2
  "@supabase/supabase-js": 2.119.0
  msw: 3.0.6
  # API
  hono: 4.13.19
  "@hono/node-server": 2.1.9
  jose: 6.2.17
  # Shared
  zod: 4.6.7
  ts-fsrs: 6.0.0
  uuid: 14.0.3
  "@anthropic-ai/sdk": 1.9.0
  # Database
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  postgres: 4.1.1
  "@electric-sql/pglite": 0.5.16
  # Pipeline
  yaml: 2.9.1
  # Tooling and tests
  typescript: 7.0.2
  "@types/node": 24.19.2
  "@biomejs/biome": 2.6.8
  vitest: 5.1.0
  "@playwright/test": 1.65.1
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/user-event": 14.6.12
  "@testing-library/jest-dom": 7.0.1
  fake-indexeddb: 6.2.8
  jsdom: 31.0.1
  fast-check: 4.10.2
  tsx: 4.23.15

minimumReleaseAgeExclude:
  - "@anthropic-ai/sdk@1.9.0"
  - "@hono/node-server@2.1.9"
  - "@tanstack/query-core@5.108.0"
  - "@tanstack/react-query@5.108.0"

allowBuilds:
  esbuild: true
