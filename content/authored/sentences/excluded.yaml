- text: "Tá, ktorú som najviac miloval."
  reason: "The treebank labels \"najviac\" a numeral in the accusative; here it works as the adverb \"the most\", so the label would mislead a learner."
- text: "Táto komunita nasleduje svoje vlastné pravidlá."
