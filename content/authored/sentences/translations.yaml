# English translations of real sentences (Tatoeba, the treebank) that an editor corrected,
# each with the reason. The Slovak sentence is good; the English beside it said something
# else, or hid the word the sentence is shown for. The sentences stage shows `en` in place
# of the source's translation. A sentence is matched by its exact Slovak text. Sorted by text.
- text: "Ak budem mať čas, prídem."
  en: "If I have time, I'll come."
  reason: "The source (\"If time permits\") hid \"budem mať\" (I have)."
- text: "Ak si ma z tej strany nepoznal, tak si ma nepoznal vôbec."
  en: "If you didn't know that side of me, then you didn't know me at all."
  reason: "The source left out \"z tej strany\" (that side) and \"vôbec\" (at all)."
- text: "Aké tu býva na jar počasie?"
  en: "What is the weather usually like here in spring?"
  reason: "The source's English was unidiomatic and dropped the habitual \"býva\"."
- text: "Chcem sa naučiť tancovať."
  en: "I want to learn how to dance."
  reason: "\"Chcem\" is \"I want\"; the source said \"I would like\"."
- text: "Dala si dole oblečenie."
  en: "She took off her clothes."
  reason: "\"dať si dole\" is \"to take off\"; the source said \"put away\"."
- text: "Ešte raz sa veľmi ospravedlňujem."
  en: "Once again, I really apologize."
  reason: "The source (\"Again, a thousand apologies\") hid the verb \"ospravedlňujem sa\"."
- text: "Jar je už vo vzduchu."
  en: "Spring is already in the air."
  reason: "\"vo vzduchu\" is \"in the air\"; the source said \"Spring is already here\"."
- text: "Je mi to jedno."
  en: "I don't care."
  reason: "The source's English was vulgar; the Slovak is neutral."
- text: "Je čas odtiaľto vypadnúť."
  en: "It's time to get out of here."
  reason: "The source added a swear word (\"get the hell out\")."
- text: "Jeden z nás sa musí zúčastniť stretnutia."
  en: "One of us must attend the meeting."
  reason: "The source added \"the two of\"."
- text: "Každý jeden človek hovorí nejakým jazykom."
  en: "Every single person speaks some language."
  reason: "The source (\"Everyone speaks a language\") hid \"jeden\" and \"nejakým\"."
- text: "Kde sa nachádza hotel?"
  en: "Where is the hotel located?"
  reason: "The source's \"Where is the hotel at?\" is nonstandard English."
- text: "Konečne som našiel riešenie tohto problému."
  en: "I finally found the solution to this problem."
  reason: "\"tohto problému\" is \"this problem\"; the source said \"the problem\"."
- text: "Majú veľké množstvo údajov."
  en: "They have a large amount of data."
  reason: "\"veľké množstvo údajov\" is \"a large amount of data\"; the source said \"a large stock of information\"."
- text: "Musíš študovať angličtinu krok po kroku."
  en: "You have to study English step by step."
  reason: "The source's English (\"English is something to be learned step by step\") hid \"musíš\" and the verb \"študovať\"."
- text: "Myslím si, že nám chce predviesť svoje nové šaty."
  en: "I think she wants to show off her new dress to us."
  reason: "The source dropped \"chce\" (wants)."
- text: "Myslíte si, že angličtina je zložitá?"
  en: "Do you think English is complicated?"
  reason: "\"zložitá\" is \"complicated\"; the source said \"difficult\" (ťažká)."
- text: "Myslíš si, že angličtina je zložitá?"
  en: "Do you think English is complicated?"
  reason: "\"zložitá\" is \"complicated\"; the source said \"difficult\" (ťažká)."
- text: "Mám svoje nedostatky, ale sú to nedostatky, ktoré sa dajú ľahko napraviť."
  en: "I have my flaws, but they are flaws that can easily be fixed."
