# The editor's list of dictionary entries (read by the dict stage, see
# tools/pipeline/src/stages/dict/overrides.ts). The entry of a lemma named here shows
# exactly these glosses, in this order, each with its note. `why` says what was wrong with
# the entry as its source gave it: the order of the meanings, a wrong sense, a missing main
# meaning, a rare sense, the form of a gloss or a note. Sorted by key.
#
# Written in the content fill of 2026-11-20 from a reading of every Wiktionary entry of the
# 3,000 most frequent lemmas and of the reading texts (docs/content-build.md); no gloss
# here is verified by a person.
