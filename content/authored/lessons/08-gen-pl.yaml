summaryMd: After five and more, and after *veľa* and *koľko*. *päť kníh, veľa ľudí.*
explain:
  md: |-
    The genitive plural follows numbers from five up and words of quantity: *päť kníh*, *veľa ľudí*, *koľko rokov*. It also follows the genitive prepositions: *do škôl*, *z miest*.

    - Masculine nouns take *-ov*: *päť domov*, *veľa bratov*.
    - Feminine nouns in *-a* and neuter nouns in *-o* lose their ending, and the last syllable often gets longer: *žena → žien*, *škola → škôl*, *kniha → kníh*, *mesto → miest*, *auto → áut*.
    - Nouns in a consonant and in *-ie* take *-í*: *miestností*, *námestí*.

    This case has the most exceptions, so learn each common word with its genitive plural.
  examples:
    - sk: Mám päť [kníh].
      en: I have five books.
    - sk: Je tu veľa [ľudí].
      en: There are a lot of people here.
    - sk: Koľko máš [rokov]?
      en: How old are you?
