summaryMd: Three plural cases with regular endings. *v mestách, s kamarátmi, k susedom.*
explain:
  md: |-
    These three plural cases are the most regular in Slovak. Learn the endings by gender family.

    - **Locative**: masculine *-och* (*v obchodoch*, *o bratoch*), feminine and neuter *-ách*, *-iach* (*v školách*, *na uliciach*, *v mestách*).
    - **Instrumental**: masculine *-mi* or *-ami* (*s bratmi*, *s kolegami*), feminine and neuter *-ami*, *-iami* (*so ženami*, *s autami*, *s miestnosťami*).
    - **Dative**: masculine *-om* (*bratom*), feminine and neuter *-ám*, *-iam* (*ženám*, *mestám*, *uliciam*).
  examples:
    - sk: Bývame v [mestách].
      en: We live in towns.
    - sk: Idem von s [kamarátmi].
      en: I am going out with friends.
    - sk: Pomáham [susedom].
      en: I help the neighbours.
