summaryMd: The genitive follows *do*, *z*, *od*, *bez* and *u*, and means *of*. *Idem do mesta.*
explain:
  md: |-
    The genitive means **of** (*šálka kávy*, a cup of coffee) and follows many prepositions: *do* (to, into), *z* (from, out of), *od* (from a person), *bez* (without) and *u* (at someone's place).

    - Feminine nouns in *-a* take *-y* after a hard consonant and *-e* after a soft one: *do školy*, *z práce*. Most nouns in a consonant take *-i*: *z miestnosti*.
    - Masculine nouns for people take *-a*: *od brata*. Those in *-a* take *-u*: *od kolegu*.
    - Masculine nouns for things take *-a* or *-u*: *do obchodu*, *z domu*, *bez stola*. The dictionary tells you which.
    - Neuter nouns take *-a*: *do mesta*, *z námestia*.
  examples:
    - sk: Idem do [mesta].
      en: I am going to town.
    - sk: Som z [Bratislavy].
      en: I am from Bratislava.
    - sk: Pijem čaj bez [cukru].
      en: I drink tea without sugar.
