# Lesson 2 of the declension course (stage `lessons`, package C4).
id: loc-sg
ord: 2
titleEn: Locative singular
titleSk: Lokál jednotného čísla
case: loc
number: sg
prerequisites: [acc-sg]
buckets: [loc.sg.m_inan, loc.sg.f, loc.sg.n, loc.sg.m_anim]
