name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Client first load budget (200 KB gzip JS)
        run: pnpm --filter @app/web build && pnpm --filter @app/web size
  e2e:
    # Every browser suite of the web app (shell, gallery, the six screen packages), one after
    # another on free ports with separate build folders (apps/web/scripts/e2e-all.mjs).
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright (CI only; the cloud containers have /opt/pw-browsers)
        run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm --filter @app/web e2e:all
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: |
            apps/web/test-results
            apps/web/src/features/*/e2e/test-results
            apps/web/node_modules/.cache/tutor-e2e-results
          if-no-files-found: ignore
